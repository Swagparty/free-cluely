# MONA Live — build & publish to Google Cloud Storage (Windows only)
#
# Triggers on merge/push to master, version tags (v*), and manual dispatch.
#
# Public URL (via api.mona-ai.cloud load balancer backend bucket):
#   https://api.mona-ai.cloud/mona-live/
#
# Required GitHub secrets:
#   GCP_SA_KEY  — service account JSON key with storage.objectAdmin
#   GCP_BUCKET  — mona-live-updates
#   SSL_COM_ESIGNER_USERNAME       — SSL.com account username
#   SSL_COM_ESIGNER_PASSWORD       — SSL.com account password
#   SSL_COM_ESIGNER_CREDENTIAL_ID  — eSigner credential ID
#   SSL_COM_ESIGNER_TOTP_SECRET    — eSigner TOTP secret (from QR enrollment)
#
# Optional GitHub variable:
#   GCP_PREFIX  — object prefix (default: mona-live)

name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: bash
        run: npm version --no-git-tag-version "${{ needs.resolve-version.outputs.version }}"

      - name: Build renderer
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Check code-signing secrets
        shell: bash
        env:
          SSL_COM_ESIGNER_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
          SSL_COM_ESIGNER_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
          SSL_COM_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_COM_ESIGNER_CREDENTIAL_ID }}
          SSL_COM_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_COM_ESIGNER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSL_COM_ESIGNER_USERNAME SSL_COM_ESIGNER_PASSWORD SSL_COM_ESIGNER_TOTP_SECRET; do
            value="$(printf "%s" "${!name}" | tr -d '[:space:]')"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four SSL_COM_ESIGNER_* secrets under Settings → Secrets and variables → Actions"
            echo "Activate eSigner on SSL.com first (PIN + TOTP QR), then store username, password, credential ID, and TOTP secret."
            exit 1
          fi
          echo "Code-signing secrets present"

      - name: Download CodeSignTool
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          DIR="${GITHUB_WORKSPACE}/.codesigntool"
          ZIP="${RUNNER_TEMP}/CodeSignTool.zip"
          mkdir -p "$DIR"
          echo "Downloading $URL"
          curl -fsSL -o "$ZIP" "$URL"
          python - <<'PY'
          import zipfile, os
          zip_path = os.environ["RUNNER_TEMP"] + "/CodeSignTool.zip"
          dest = os.environ["GITHUB_WORKSPACE"] + "/.codesigntool"
          with zipfile.ZipFile(zip_path) as z:
              z.extractall(dest)
          PY
          JAR="$(find "$DIR" -name 'code_sign_tool-*.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "CodeSignTool jar not found"
            find "$DIR" | head -n 50
            exit 1
          fi
          echo "Found $JAR"
          echo "CODESIGNTOOL_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Verify eSigner credentials
        shell: bash
        env:
          SSL_COM_ESIGNER_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
          SSL_COM_ESIGNER_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
          SSL_COM_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_COM_ESIGNER_CREDENTIAL_ID }}
        run: |
          set +e
          JAR="$(find "${CODESIGNTOOL_DIR}" -name 'code_sign_tool-*.jar' | head -n 1)"
          CONF="$(find "${CODESIGNTOOL_DIR}" -type d -name conf | head -n 1)"
          cd "$(dirname "$CONF")" || exit 1
          {
            echo "Listing credential IDs..."
            java -jar "$JAR" get_credential_ids -username="$SSL_COM_ESIGNER_USERNAME" -password="$SSL_COM_ESIGNER_PASSWORD"
            echo "Credential info for configured id..."
            java -jar "$JAR" credential_info -username="$SSL_COM_ESIGNER_USERNAME" -password="$SSL_COM_ESIGNER_PASSWORD" -credential_id="$SSL_COM_ESIGNER_CREDENTIAL_ID"
          } 2>&1 | tee "${GITHUB_WORKSPACE}/creds.log"
          encoded="$(sed -e 's/%/%25/g' -e 's/\r$//' "${GITHUB_WORKSPACE}/creds.log" | awk '{ printf "%s%%0A", $0 }')"
          echo "::notice::eSigner credential discovery:%0A${encoded}"

      - name: Package Windows app
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign app executable
        shell: bash
        env:
          SSL_COM_ESIGNER_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
          SSL_COM_ESIGNER_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
          SSL_COM_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_COM_ESIGNER_TOTP_SECRET }}
        run: bash scripts/codesign.sh "release/win-unpacked/MONA Live.exe"

      - name: Build Windows installer
        run: npx electron-builder --win --prepackaged release/win-unpacked --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign Windows installer
        shell: bash
        env:
          SSL_COM_ESIGNER_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
          SSL_COM_ESIGNER_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
          SSL_COM_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_COM_ESIGNER_TOTP_SECRET }}
        run: |
          EXE="$(find release -maxdepth 1 -name 'MonaLive-Setup-*.exe' | head -n 1)"
          bash scripts/codesign.sh "$EXE"

      - name: Verify signatures
        shell: pwsh
        run: |
          $targets = @((Get-ChildItem release -Filter 'MonaLive-Setup-*.exe').FullName, (Resolve-Path 'release/win-unpacked/MONA Live.exe').Path)
          $failed = $false
          foreach ($t in $targets) {
            $sig = Get-AuthenticodeSignature $t
            Write-Output "$([System.IO.Path]::GetFileName($t)): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Output "::error::One or more binaries are not validly signed"; exit 1 }

      - name: Refresh release metadata
        shell: bash
        env:
          SKIP_SIGN: "true"
        run: node scripts/sign-release.cjs

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: [resolve-version, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/windows

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        env:
          GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
          GCP_PREFIX: ${{ vars.GCP_PREFIX }}
        run: |
          set -euo pipefail
          PREFIX="${GCP_PREFIX:-mona-live}"
          DEST="gs://${GCP_BUCKET}/${PREFIX}/"
          echo "Uploading to ${DEST}"
          gsutil -m cp release/windows/* "$DEST"
          gsutil setmeta -h "Cache-Control:no-cache, max-age=0" "${DEST}latest.yml"
          SETUP="MonaLive-Setup-${{ needs.resolve-version.outputs.version }}.exe"
          gsutil cp "${DEST}${SETUP}" "${DEST}MonaLive-Setup-latest.exe"
          gsutil setmeta -h "Cache-Control:no-cache, max-age=0" "${DEST}MonaLive-Setup-latest.exe"
          echo "Published version ${{ needs.resolve-version.outputs.version }} to ${DEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: MONA Live v${{ needs.resolve-version.outputs.version }}
          files: release/windows/*
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
